version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Capped in pyproject.toml: pandas 3 needs NumPy 2, ruled out by the Intel-Mac PyTorch pin.
      - dependency-name: pandas
        update-types: ["version-update:semver-major"]
