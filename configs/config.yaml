seed: 42

data:
  url: https://huggingface.co/datasets/garythung/trashnet/resolve/main/dataset-resized.zip
  # SHA-256 of the archive (Hugging Face LFS etag, 2026-10-20); data.py refuses any other file.
  sha256: c060e8abfe5d6de0578ca15be1ed8ad0794a865d333c3473d53d1d9ad6e38b8c
  raw_dir: data/raw
  processed_dir: data/processed
  classes: [cardboard, glass, metal, paper, plastic, trash]
  expected_counts: {cardboard: 403, glass: 501, metal: 410, paper: 594, plastic: 482, trash: 137}

paths:
  models_dir: models
  reports_dir: reports
  figures_dir: reports/figures

split:
  # Photos of the same object (TrashNet photographs many objects several times) must stay on
  # one side of the split. Within each class, every pair of photos whose ImageNet ResNet18
  # features have cosine similarity >= this threshold is joined (plus average-linkage
  # clusters at the same threshold); evidence for the value in reports/data.md. split.py
  # refuses to save a split with a cross-split pair at or above it.
  similarity_threshold: 0.86
  # StratifiedGroupKFold: one fold is the test set, one the validation set, the rest train.
  n_folds: 7
  file: splits/split.csv

train:
  arch: resnet18          # ImageNet-pretrained torchvision model, new 6-class head
  epochs: 25
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.0001
  label_smoothing: 0.1
  patience: 5             # early stopping on validation loss
  # DataLoader worker processes: 2 on a GPU, 0 on CPU. On macOS with PyTorch 2.2.2, worker
  # processes kept the interpreter from exiting after training (observed, 2026-10-20), and
  # on CPU the model, not image loading, is the bottleneck.
  num_workers: auto

# The evaluated ONNX model, published as a GitHub release asset; make fetch-model downloads
# it and checks it against the SHA-256 in models/model.json.
release:
  model_url: https://github.com/vladzpop11/waste-sorting-classifier/releases/download/model-v1/model.onnx
