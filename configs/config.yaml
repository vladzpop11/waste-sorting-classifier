seed: 42

data:
  url: https://huggingface.co/datasets/garythung/trashnet/resolve/main/dataset-resized.zip
  # SHA-256 of the archive (Hugging Face LFS etag, 2026-10-20); data.py refuses any other file.
  sha256: c060e8abfe5d6de0578ca15be1ed8ad0794a865d333c3473d53d1d9ad6e38b8c
  raw_dir: data/raw
  processed_dir: data/processed
  classes: [cardboard, glass, metal, paper, plastic, trash]
  expected_counts: {cardboard: 403, glass: 501, metal: 410, paper: 594, plastic: 482, trash: 137}

# Version 4 adds RealWaste (Single, Iranmanesh & Raad, 2023): real waste photographed at a
# landfill's reception point, 524x524. UCI lists it as CC BY 4.0, the authors' README as
# CC BY-NC-SA 4.0; the stricter licence is followed (README, Licence). Its images go under
# data/raw/images/realwaste/<our class>/. Mapping to our six classes: miscellaneous and
# textile trash -> trash; food organics and vegetation are not used.
realwaste:
  url: https://archive.ics.uci.edu/static/public/908/realwaste.zip
  sha256: 1ede08b32358ee62065bcc1c8cb47a2ece04e8dff5b1fb53342bb8750895b2f3
  folder: realwaste
  classes:
    Cardboard: cardboard
    Glass: glass
    Metal: metal
    Paper: paper
    Plastic: plastic
    Miscellaneous Trash: trash
    Textile Trash: trash
  expected_counts: {Cardboard: 461, Food Organics: 411, Glass: 420, Metal: 790,
                    Miscellaneous Trash: 495, Paper: 500, Plastic: 921, Textile Trash: 318,
                    Vegetation: 436}

paths:
  models_dir: models
  reports_dir: reports
  figures_dir: reports/figures

split:
  # Photos of the same object (TrashNet photographs many objects several times) must stay on
  # one side of the split. Within each class, every pair of photos whose ImageNet ResNet18
  # features have cosine similarity >= this threshold is joined (plus average-linkage
  # clusters at the same threshold); evidence for the value in reports/data.md. split.py
  # refuses to save a split with a cross-split pair at or above it.
  similarity_threshold: 0.86
  # StratifiedGroupKFold: one fold is the test set, one the validation set, the rest train.
  n_folds: 7
  file: splits/split.csv
  # Version 4: TrashNet keeps its version 2 split exactly (frozen in this file), so that
  # its test photos are never trained on and versions can be compared on them; only the
  # RealWaste photos are split anew (split.py).
  trashnet_v2: splits/trashnet-v2.csv
  # RealWaste groups larger than this (chains of look-alike photos, up to 263) go to
  # training, so that its validation and test sets are made of many independent objects
  # (fixed before training: README, Data).
  chains_to_train_above: 20

train:
  arch: resnet18          # ImageNet-pretrained torchvision model, new 6-class head
  epochs: 25
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.0001
  label_smoothing: 0.1
  patience: 5             # early stopping on validation loss
  # DataLoader worker processes: 2 on a GPU, 0 on CPU. On macOS with PyTorch 2.2.2, worker
  # processes kept the interpreter from exiting after training (observed, 2026-10-20), and
  # on CPU the model, not image loading, is the bottleneck.
  num_workers: auto

# The familiarity check (familiarity.py): is a photo like the training photos at all?
# Score (version 4): minus the Mahalanobis distance from the model's features to the
# nearest class mean of the training features (version 3: nearest training photo). Rule,
# fixed before measuring it: the threshold lets 95% of validation photos through.
# Everyday photos for measuring it: Imagenette (fast.ai), a 10-class ImageNet subset; its
# validation photos only, shuffled with seed 0. The first 1,500 were used to choose the
# score (README); the rest measure it.
familiarity:
  keep: 0.95
  ood_url: https://s3.amazonaws.com/fast-ai-imageclas/imagenette2-160.tgz
  ood_sha256: 64d0c4859f35a461889e0147755a999a48b49bf38a7e0f9bd27003f10db02fe5
  ood_dir: data/ood
  ood_used_for_choosing: 1500

# Calibration (calibrate.py): the logits are divided by one temperature before the softmax,
# so the displayed confidence means what it says; labels never change. Rule, fixed before
# measuring it (2026-10-21): the temperature minimises the negative log-likelihood of the
# validation photos. Its effect on new photos is measured by fitting on one half of the
# validation groups and scoring the other half, both ways. The low-confidence note is then
# chosen again on the calibrated validation probabilities (make errors), by its usual rule.
calibration:
  method: temperature
  objective: negative_log_likelihood

# Version 4's single test evaluation also scores version 3 on the same photos (same run),
# from its release files, checked against its archived record.
compare:
  name: v3
  model_json: reports/history/v3/model.json
  base_url: https://github.com/vladzpop11/waste-sorting-classifier/releases/download/model-v3/
  dir: artifacts/model-v3

# The served files, published as GitHub release assets: the evaluated ONNX model (logits
# and features) and the familiarity file. make fetch-model downloads them and checks each
# against its SHA-256 in models/model.json.
release:
  base_url: https://github.com/vladzpop11/waste-sorting-classifier/releases/download/model-v4/

# Model selection, fixed before training (version 2: 2026-10-20; version 4: 2026-10-20,
# before its Kaggle run). Every architecture is trained once per seed on Kaggle. The
# architecture with the higher mean validation score wins; if the means are within
# `margin`, the faster one wins. The deployed checkpoint is the winning architecture's run
# with the lowest validation loss. select.py applies this. Version 4's score is the mean of
# the per-source validation macro F1 (TrashNet and RealWaste count equally).
selection:
  archs: [resnet18, efficientnet_b0]
  seeds: [42, 43, 44]
  margin: 0.01
  faster: efficientnet_b0
  score: mean_over_sources
  sources: [trashnet, realwaste]
  runs_dir: artifacts/kaggle-v4/run
